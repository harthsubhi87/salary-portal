name: Keep Streamlit App Alive 24/7

on:
  schedule:
    # يعمل تلقائياً كل 4 ساعات على مدار اليوم
    - cron: '0 */4 * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً بأي وقت للتجربة

jobs:
  wake-up-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Visit App and Wake Up if Sleeping
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          # ⚠️ ضع رابط تطبيقك الكامل بين القوسين أدناه
          APP_URL = 'https://YOUR-APP-NAME.streamlit.app'

          with sync_playwright() as p:
              print(f'🌐 جاري فتح التطبيق: {APP_URL}')
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              try:
                  page.goto(APP_URL, timeout=60000)
                  time.sleep(6)

                  # البحث عن زر الإيقاظ في حال كان التطبيق نائماً
                  wake_button = page.locator('button:has-text(\"Yes, get this app back up!\")')
                  if wake_button.count() > 0:
                      print('⚠️ التطبيق كان في وضع النوم! جاري الضغط على زر الإيقاظ تلقائياً...')
                      wake_button.click()
                      time.sleep(12)
                      print('✅ تم إيقاظ التطبيق بنجاح!')
                  else:
                      print('✅ التطبيق يعمل ومستيقظ بالفعل.')
              except Exception as e:
                  print(f'حدث خطأ أثناء المحاولة: {e}')
              finally:
                  browser.close()
          "
